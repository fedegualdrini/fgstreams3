[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Declared explicitly because framework auto-detection has never fired on this
# project: every deploy so far reported `framework: null` and shipped no
# functions, so `.next` was served as a plain static folder and all dynamic
# routes 404'd. The adapter reads the build output from `publish` above and
# generates the server handler, redirects and headers.
[[plugins]]
  package = "@netlify/plugin-nextjs"
